<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Circuit</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111e;font-family:system-ui,Arial;color:#fff}#wrap{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#163b5d,#07111e 60%)}canvas{display:block;width:100vw;height:100vh;max-width:1280px;max-height:720px;image-rendering:auto;box-shadow:0 0 50px #00e5ff33}#hud{position:fixed;left:16px;top:14px;display:flex;gap:10px;flex-wrap:wrap;z-index:3}.pill{background:#071727cc;border:1px solid #42e8ff66;border-radius:14px;padding:8px 12px;backdrop-filter:blur(8px);font-weight:700}.title{font-size:20px;letter-spacing:2px;color:#7ff5ff}.screen{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:#020914aa}.card{width:min(92vw,520px);padding:30px;border:1px solid #5ceeff55;border-radius:26px;background:#071625ee;box-shadow:0 20px 80px #0008;text-align:center}.card h1{font-size:42px;margin:0 0 8px;background:linear-gradient(90deg,#fff,#45efff);color:transparent;background-clip:text}.card p{opacity:.8}.btn{border:0;border-radius:16px;padding:15px 30px;font-size:18px;font-weight:800;background:linear-gradient(90deg,#00c8ff,#7b5cff);color:white;box-shadow:0 10px 30px #00bfff44;cursor:pointer}.touch{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;z-index:4;pointer-events:none}.touch button{pointer-events:auto;width:76px;height:76px;border-radius:24px;border:1px solid #ffffff33;background:#071727aa;color:white;font-size:28px}.touch .mid{display:flex;gap:12px}.hidden{display:none}@media(min-width:800px){.touch{opacity:.45}.touch button{width:62px;height:62px}}</style></head><body><div id="wrap"><canvas id="game"></canvas></div><div id="hud" class="hidden"><div class="pill title">NEON CIRCUIT</div><div class="pill">LAP <span id="lap">1/3</span></div><div class="pill">POS <span id="pos">1</span></div><div class="pill">SPEED <span id="speed">0</span></div><div class="pill">TIME <span id="time">0.0</span></div></div><div id="start" class="screen"><div class="card"><h1>NEON CIRCUIT</h1><p>Arcade street racing • AI rivals • responsive mobile controls</p><button id="startBtn" class="btn">START RACE</button><p>Desktop: WASD / Arrow Keys &nbsp; Mobile: touch controls</p></div></div><div id="touch" class="touch hidden"><div class="mid"><button data-k="left">◀</button><button data-k="right">▶</button></div><div class="mid"><button data-k="brake">▼</button><button data-k="up">▲</button></div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),start=document.getElementById('start'),hud=document.getElementById('hud'),touch=document.getElementById('touch');let W,H,dpr,run=false,last=0,t=0,keys={},seed=7;const player={x:0,y:0,a:0,v:0,lane:0,lap:0,progress:0};const bots=[{lane:-.7,p:0,v:145,c:'#ff4d8d'},{lane:.7,p:-.2,v:138,c:'#ffd447'},{lane:-1.35,p:-.5,v:132,c:'#9b7bff'}];const N=900;let track=[];for(let i=0;i<N;i++){let a=i/N*Math.PI*2;let r=250+45*Math.sin(a*2)+25*Math.sin(a*5);track.push({x:Math.cos(a)*r,y:Math.sin(a)*r*.68});}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function point(p){let i=Math.floor(((p%1)+1)%1*N);return track[i]}function drawTrack(){x.save();x.translate(W/2,H/2);let scale=Math.min(W/900,H/620);x.scale(scale,scale);x.lineJoin='round';x.lineCap='round';x.beginPath();track.forEach((q,i)=>i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y));x.closePath();x.strokeStyle='#03070d';x.lineWidth=150;x.stroke();x.strokeStyle='#263247';x.lineWidth=132;x.stroke();x.strokeStyle='#0b1220';x.lineWidth=118;x.stroke();x.setLineDash([18,18]);x.strokeStyle='#43e9ff88';x.lineWidth=3;x.stroke();x.setLineDash([]);for(let i=0;i<track.length;i+=18){let q=track[i];x.fillStyle=i%36?'#00eaff55':'#ff3ea555';x.beginPath();x.arc(q.x,q.y,4,0,7);x.fill()}x.restore()}
function car(q,col,ang,scale=1){x.save();x.translate(W/2+q.x,H/2+q.y);x.rotate(ang);x.scale(scale,scale);x.shadowBlur=18;x.shadowColor=col;x.fillStyle=col;x.beginPath();x.roundRect(-19,-9,38,18,7);x.fill();x.shadowBlur=0;x.fillStyle='#07111e';x.fillRect(-8,-6,14,8);x.fillStyle='#fff8';x.fillRect(12,-6,4,4);x.fillStyle='#ff3355';x.fillRect(-16,-6,4,4);x.restore()}
function update(dt){let accel=(keys.up||keys.w)?110:0;let brake=(keys.down||keys.s)?-150:0;let steer=(keys.left||keys.a)?-1:(keys.right||keys.d)?1:0;player.v+= (accel+brake- player.v*.65)*dt;player.v=Math.max(0,Math.min(230,player.v));player.a+=steer*2.1*dt*(.3+player.v/230);player.x+=Math.cos(player.a)*player.v*dt*.75;player.y+=Math.sin(player.a)*player.v*dt*.75;let target=track[Math.floor((player.progress%1)*N)];let dx=target.x-player.x,dy=target.y-player.y;if(Math.hypot(dx,dy)>120){player.x+=(dx)*dt*.55;player.y+=(dy)*dt*.55}player.progress+=player.v*dt/14000;if(player.progress>=1){player.progress-=1;player.lap++}bots.forEach(b=>{b.p=(b.p+b.v*dt/14000)%1});t+=dt;document.getElementById('lap').textContent=Math.min(player.lap+1,3)+'/3';document.getElementById('speed').textContent=Math.round(player.v);document.getElementById('time').textContent=t.toFixed(1);if(player.lap>=3)finish()}
function finish(){run=false;start.classList.remove('hidden');start.querySelector('h1').textContent='FINISH!';start.querySelector('p').textContent='Race complete — time '+t.toFixed(1)+'s';startBtn.textContent='RACE AGAIN'}
function render(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0c2440');g.addColorStop(1,'#030810');x.fillStyle=g;x.fillRect(0,0,W,H);drawTrack();let pp=point(player.progress);let pn=point(player.progress+.002);player.x=(player.x*.92+pp.x*.08);player.y=(player.y*.92+pp.y*.08);car({x:player.x,y:player.y},'#32eaff',Math.atan2(pn.y-pp.y,pn.x-pp.x),1.15);bots.forEach(b=>{let q=point(b.p),r=point(b.p+.003);car({x:q.x,y:q.y},b.c,Math.atan2(r.y-q.y,r.x-q.x),.9)});x.fillStyle='#fff';x.font='700 13px system-ui';x.fillText('VISIONQA PLAYTEST BUILD',18,H-18)}
function loop(now){if(!run)return;let dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);render();requestAnimationFrame(loop)}function begin(){player.x=track[0].x;player.y=track[0].y;player.progress=0;player.lap=0;player.v=0;t=0;run=true;start.classList.add('hidden');hud.classList.remove('hidden');touch.classList.remove('hidden');last=performance.now();requestAnimationFrame(loop)}startBtn.onclick=begin;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointercancel=()=>keys[k]=false});
</script></body></html>
